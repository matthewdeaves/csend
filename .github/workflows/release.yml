name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build csend
        run: cmake -B build && cmake --build build
      - name: Package
        run: tar czf csend-posix-linux-x64.tar.gz -C build csend-posix
      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          files: csend-posix-linux-x64.tar.gz
